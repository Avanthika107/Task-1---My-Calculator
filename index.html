<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
    <div class="calculator">
        <input type="text" class="display" id="display" inputmode="none" autocomplete="off" autofocus aria-label="Calculator Display Screen">
        <div class="buttons">

            <div class="standard-btns">

                <button class="toggle-mode-btn">SCI</button>
                <button>AC</button>
                <button>DEL</button>
                <button>(</button>
                <button>)</button>

                <button>xʸ</button>
                <button>/</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>

                <button>*</button>
                <button>-</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>

                

                <button>+</button>
                <button>0</button>
                <button>2</button>
                <button>3</button>
                <button>1</button>


                <button>.</button>
                <button class="btn-equals">=</button>
            </div>



            <div class="scientific-sidebar">
                
                <button class="sci-btn">eˣ</button>
                <button class="sci-btn">sin</button>
                
                <button class="sci-btn">ln</button>
                <button class="sci-btn">cos</button>
                
                <button class="sci-btn">logₓ</button> <!-- log with base placeholder -->
                <button class="sci-btn">tan</button>
                
                <button class="sci-btn">ʸ√x</button> <!-- root with radical/index placeholder -->
                <button class="sci-btn">sin⁻¹</button>
                
                <button class="sci-btn">tan⁻¹</button>
                <button class="sci-btn">cos⁻¹</button>
            </div>
        
        </div>

    </div>

    </main>
</body>
</html>
